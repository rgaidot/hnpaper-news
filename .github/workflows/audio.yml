name: Generate Audio

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force:
        description: 'Force regeneration of all audio'
        required: false
        default: false
        type: boolean
      files:
        description: 'Space-separated news files to process (e.g. 2026-10-11-2208), empty = all'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: audio
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate Audio
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FLAGS="--force"
          fi
          bun run scripts/generate-audio.ts $FLAGS ${{ github.event.inputs.files }}

      - name: Commit audio index updates
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/audio-index.json || true
          git commit -m "chore(audio): update audio-index.json [skip ci]" || echo "No changes to commit"
          git push || echo "No changes to push"
